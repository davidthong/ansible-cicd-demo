name: Ansible Lint

on:
  push:
    branches:
      - "feature/**"
      - "feature-*"
      - "feature"

jobs:
  ansible-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint

      - name: Run ansible-lint
        shell: bash
        run: |
          set +e

          find playbooks roles \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            -print0 | xargs -0 ansible-lint

          rc=$?

          set -e

          if [ "$rc" -ne 0 ]; then
            echo "::warning::ansible-lint found violations. Review the lint output above."
          else
            echo "ansible-lint passed with no violations."
          fi

          exit 0
