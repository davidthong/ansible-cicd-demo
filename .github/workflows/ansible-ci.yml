---
name: Ansible CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run playbook syntax checks
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        shell: bash
        run: |
          find playbooks \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            -print0 | xargs -0 -n1 ansible-playbook --syntax-check

  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ansible-lint
        shell: bash
        run: |
          find playbooks roles \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            -print0 | xargs -0 ansible-lint

  molecule:
    name: Molecule
    runs-on: ubuntu-latest

    needs:
      - syntax-check
      - lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Molecule test
        working-directory: roles/demo_web
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        run: |
          molecule test

  ci-success:
    name: CI passed
    runs-on: ubuntu-latest

    needs:
      - syntax-check
      - lint
      - molecule

    steps:
      - name: Report success
        run: |
          echo "All Ansible CI quality gates passed."
