---
name: Ansible CI

on:
  pull_request:

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run playbook syntax check
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        run: |
          ansible-playbook --syntax-check playbooks/good.yml


  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ansible-lint
        shell: bash
        run: |
          find playbooks roles \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            ! -name "bad.yml" \
            -print0 | xargs -0 ansible-lint


  lint-negative-demo:
    name: Demonstrate lint rejection
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prove intentionally bad code is rejected
        shell: bash
        run: |
          set +e
          ansible-lint playbooks/bad.yml
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "::error::bad.yml unexpectedly passed ansible-lint"
            exit 1
          fi

          echo "Success: ansible-lint rejected the intentionally bad playbook."


  molecule:
    name: Molecule
    runs-on: ubuntu-latest

    needs:
      - syntax-check
      - lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Molecule test
        working-directory: roles/demo_web
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        run: |
          molecule test


  ci-success:
    name: CI passed
    runs-on: ubuntu-latest

    needs:
      - syntax-check
      - lint
      - lint-negative-demo
      - molecule

    steps:
      - name: Report success
        run: echo "All Ansible CI quality gates passed."
